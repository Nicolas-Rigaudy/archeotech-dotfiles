# Archeotech lid-switch policy (logics item_011).
#
# Problem: with logind at defaults the laptop suspends on lid-close even when
# docked to external monitors — logind's "docked" heuristic doesn't reliably
# count displays behind hubs/adapters, so HandleLidSwitchDocked=ignore never
# fires and the machine surprise-suspends at a desk.
#
# Policy: key off AC power (always detected) instead of flaky dock-detection.
#   - On battery + undocked  -> suspend        (laptop going in a bag)
#   - On AC / external power  -> ignore: no suspend AND no lock (stays awake)
#   - Docked                  -> ignore (kept explicit; also the default)
#
# Note: "ignore" means logind takes NO action on lid-close — it does not lock
# either. hypridle still locks before any *suspend* (before_sleep_cmd =
# loginctl lock-session) and on idle timeout, but a bare lid-close on AC does
# nothing. If lock-on-lid-close (without suspend) is ever wanted, add a
# lid-close hook running `loginctl lock-session` — not done here (by choice).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
