# Archeotech lid-switch policy (logics item_011).
#
# Problem: with logind at defaults the laptop suspends on lid-close even when
# docked to external monitors — logind's "docked" heuristic doesn't reliably
# count displays behind hubs/adapters, so HandleLidSwitchDocked=ignore never
# fires and the machine surprise-suspends at a desk.
#
# Policy: key off AC power (always detected) instead of flaky dock-detection.
#   - On battery + undocked  -> suspend  (laptop going in a bag)
#   - On AC, NOT docked       -> lock     (plugged-in laptop, no monitors: lock
#                                          the screen but stay awake)
#   - Docked                  -> ignore   (desk + external monitors: stay awake,
#                                          no lock; also the default)
#
# "lock" makes logind emit the session Lock signal, which hypridle catches
# (lock_cmd = hyprlock) — no hook needed. hypridle also locks before any
# *suspend* (before_sleep_cmd = loginctl lock-session) and on idle timeout.
# Precedence: Docked > ExternalPower > LidSwitch, so at the dock the ignore
# wins and a desk lid-close stays fully awake/unlocked.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
