devices: (
{
    name: "MX Master 3S For Business";

    // ---------------------------------------------------------------------------
    // SMARTSHIFT — auto-switches scroll wheel between ratchet and freespin
    // threshold: 1 (always free) to 255 (always ratchet), ~13 is a good middle
    // ---------------------------------------------------------------------------
    smartshift: {
        on: true;
        threshold: 13;
    };

    // ---------------------------------------------------------------------------
    // HIRESSCROLL — high-resolution smooth scrolling
    // hires: true = smooth pixel scrolling
    // invert: false = natural direction
    // target: false = let OS handle scroll target
    // ---------------------------------------------------------------------------
    hiresscroll: {
        hires: false;
        invert: false;
        target: false;
    };

    // ---------------------------------------------------------------------------
    // DPI — sensor resolution (MX Master 3S range: 200–8000)
    // ---------------------------------------------------------------------------
    dpi: 1000;

    // ---------------------------------------------------------------------------
    // BUTTONS
    // CIDs for MX Master 3S:
    //   0xc3 = gesture/thumb button (large side button)
    //   0xc4 = forward thumb button
    // ---------------------------------------------------------------------------
    buttons: (

        // Gesture button — tap = app launcher, hold + swipe = window/workspace management
        { cid: 0xc3; action = {
            type: "Gestures";
            gestures: (
                // Tap = open rofi app launcher
                { direction: "None"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTMETA", "KEY_R"];
                    };
                },
                // Swipe up = next workspace
                { direction: "Up"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTMETA", "KEY_TAB"];
                    };
                },
                // Swipe down = previous workspace
                { direction: "Down"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"];
                    };
                },
                // Swipe left = move window to left monitor
                { direction: "Left"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTMETA", "KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_LEFT"];
                    };
                },
                // Swipe right = move window to right monitor
                { direction: "Right"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTMETA", "KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_RIGHT"];
                    };
                }
            );
        }; },

        // Forward button — tap = toggle SmartShift, hold + swipe = tab switching
        { cid: 0xc4; action = {
            type: "Gestures";
            gestures: (
                // Tap = toggle SmartShift (ratchet ↔ freespin)
                { direction: "None"; mode: "OnRelease";
                    action = {
                        type: "ToggleSmartShift";
                    };
                },
                // Swipe up = next tab
                { direction: "Up"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTCTRL", "KEY_TAB"];
                    };
                },
                // Swipe down = previous tab
                { direction: "Down"; mode: "OnRelease";
                    action = {
                        type: "Keypress";
                        keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"];
                    };
                }
            );
        }; }
    );
}
);
