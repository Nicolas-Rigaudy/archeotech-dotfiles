[Theme]
# Catppuccin theme - installed via sddm-catppuccin-git (AUR)
Current=catppuccin
# Use Catppuccin Macchiato cursor theme
CursorTheme=catppuccin-macchiato-dark-cursors

[General]
# Enable numlock by default
Numlock=on

# Set keyboard layout (will be overridden by Xsetup if present)
# For multiple layouts, use comma separation: fr,us
