################################################################################
# MONITOR CONFIGURATION
################################################################################

monitor=eDP-1,1920x1200@60,0x0,1                    # Laptop (left)
monitor=HDMI-A-1,1920x1080@60,1920x0,1              # External 1 landscape (middle)
monitor=DP-3,1920x1080@60,3840x0,1,transform,3      # External 2 portrait (right, rotated 90°)

################################################################################
# WORKSPACE ASSIGNMENTS
################################################################################

workspace=1,monitor:eDP-1,default:true              # Workspace 1-3 on laptop
workspace=2,monitor:eDP-1
workspace=3,monitor:eDP-1
workspace=4,monitor:HDMI-A-1,default:true           # Workspace 4-6 on external 1
workspace=5,monitor:HDMI-A-1
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:DP-3,default:true               # Workspace 7-9 on external 2 (portrait)
workspace=8,monitor:DP-3
workspace=9,monitor:DP-3

################################################################################
# AUTOSTART  (parity with mango/autostart.sh — launches the archeotech shell)
################################################################################

# Desktop portal for screen sharing (wlr must start before the main portal)
exec-once = sh -c "/usr/lib/xdg-desktop-portal-wlr & sleep 0.5; /usr/lib/xdg-desktop-portal &"

# The archeotech Quickshell shell (bar + control center + notifications + OSD).
# Single launch point — Quickshell does NOT dedupe per-config, so a second
# launcher would double the bars + exclusion zones.
exec-once = env QT_WAYLAND_DECORATION=none quickshell -c archeotech

# Mission dashboard — auto-show on login for a few seconds, then dismiss
exec-once = sh -c "sleep 3 && qs -c archeotech ipc call dashboard openAuto"

# Keyring
exec-once = gnome-keyring-daemon --start --components=secrets

# Wallpaper daemon + restore last wallpaper (awww, matching mango)
exec-once = sh -c "awww-daemon & sleep 1; ~/.local/bin/wallpaper-set.sh --restore || ~/.local/bin/wallpaper-set.sh ~/.config/archeotech/wallpapers/arasaka.png"

# Idle manager (lock/screen-off) + system tray applets
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = ~/.local/bin/battery-alert.sh

# Clipboard history
exec-once = wl-paste --type text --watch cliphist store     # Store text copies
exec-once = wl-paste --type image --watch cliphist store    # Store image copies

################################################################################
# GENERAL SETTINGS
################################################################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c6a0f6ee) rgba(f5bde6ee) 45deg  # Mauve + Pink gradient
    col.inactive_border = rgba(6e738daa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8

    # Global window transparency (the clean INI way — per-app opacity would need
    # the Lua config; classic per-window rules are deprecated on 0.56.2).
    active_opacity   = 0.95
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    background_color = 0x000000
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

################################################################################
# INPUT CONFIGURATION
################################################################################

input {
    kb_layout = us,fr
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    resolve_binds_by_sym = true    # Makes keybinds follow keyboard layout

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0
}

################################################################################
# KEYBINDINGS
################################################################################

$mainMod = SUPER

# Reload compositor config + restart shell (parity with mango's Super+Shift+R).
# shell-reload.sh detects the compositor and runs `hyprctl reload` here.
bind = $mainMod SHIFT, R, exec, ~/.local/bin/shell-reload.sh

# Lock screen
bind = $mainMod, L, exec, hyprlock-launch.sh

# Show keybinds
bind = $mainMod, K, exec, ~/.local/bin/show-keybinds.sh

# Application launchers
bind = $mainMod, Q, exec, kitty                           # Terminal
bind = $mainMod, R, exec, qs -c archeotech ipc call launcher toggle   # App launcher (shell)
bind = $mainMod, B, exec, zen-browser                     # Browser
bind = $mainMod, E, exec, code                            # VSCode (Editor)
bind = $mainMod, N, exec, obsidian                        # Notes
bind = $mainMod, D, exec, thunar                          # File Explorer (Directory)
bind = $mainMod, G, exec, kitty --title lazygit -e lazygit   # Git TUI
bind = $mainMod SHIFT, N, exec, kitty --title navi -e navi   # Cheatsheets
bind = $mainMod CTRL, P, exec, ~/.local/bin/project-jump.sh  # Project jump (rofi)

# ── Archeotech shell panels (Quickshell IPC) ──────────────────────────────────
bind = $mainMod, semicolon, exec, qs -c archeotech ipc call notifications toggle
bind = $mainMod, comma, exec, qs -c archeotech ipc call settings toggle
bind = $mainMod SHIFT, S, exec, qs -c archeotech ipc call settings toggle
bind = $mainMod SHIFT, E, exec, qs -c archeotech ipc call editmode toggle
bind = $mainMod, Home, exec, qs -c archeotech ipc call dashboard toggle
bind = $mainMod, W, exec, qs -c archeotech ipc call wallpaper toggle
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper-set.sh --toggle-logo
bind = $mainMod SHIFT, T, exec, qs -c archeotech ipc call layout toggle
bind = $mainMod SHIFT, O, exec, ~/.local/bin/zen-opacity-toggle.sh
bind = $mainMod SHIFT, C, exec, wl-color-picker              # Colour picker

# Window controls
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod SHIFT, P, layoutmsg, pseudo            # Dwindle pseudotile
bind = $mainMod, T, layoutmsg, togglesplit             # Dwindle toggle split

# Move focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows with arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows with CTRL + arrow keys
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Switch workspaces [1-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move window to workspace [1-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Workspace navigation
bind = $mainMod, Tab, workspace, e+1                  # Next workspace
bind = $mainMod SHIFT, Tab, workspace, e-1            # Previous workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, grave, togglespecialworkspace, magic           # grave = ` key
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Screenshots
bind = $mainMod, S, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy     # Region: save + clipboard
bind = $mainMod, P, exec, grim - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy                   # Full screen: save + clipboard
bind = , Print, exec, grim - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy                       # Full screen: save + clipboard
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy # Region: save + clipboard

# Clipboard history
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Audio control (also triggers the shell's volume OSD, matching mango)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && qs -c archeotech ipc call osd volume
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && qs -c archeotech ipc call osd volume
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs -c archeotech ipc call osd volume
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control (also triggers the shell's brightness OSD)
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ -q && qs -c archeotech ipc call osd brightness
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- -q && qs -c archeotech ipc call osd brightness

# Media control
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow               # Move window
bindm = $mainMod, mouse:273, resizewindow             # Resize window

################################################################################
# WINDOW / LAYER RULES — intentionally omitted on Hyprland 0.56.2
################################################################################
# Hyprland 0.56.2 has moved window rules to the new Lua config
# (hl.window_rule{...}); the classic INI `windowrule = float, class:…` form is
# rejected outright ("invalid field float"), and `windowrulev2 = …` only parses
# with a deprecation error shown on every login. Rather than ship that overlay,
# the minor QoL rules (float pavucontrol/blueman/PiP, opacity kitty/Code) are
# left out for a clean session — this is the fallback compositor. Re-add them via
# the Lua config when migrating. Likewise `layerrule = blur, archeotech-shell`
# (shell glass blur) is rejected by 0.56.2 and deferred. All confirmed
# deterministically with ci/verify-compositor-configs.sh.
