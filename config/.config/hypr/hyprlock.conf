################################################################################
# HYPRLOCK CONFIGURATION  —  GENERATED by scripts/theme-switch.py
# Do not edit directly. Edit scripts/themes/templates/hyprlock.conf.tmpl,
# then re-run a theme switch. Colors come from the active theme.json.
#
# hyprlock replaced swaylock (2026-07-08): a separately-maintained codebase (not
# the sway lineage) that fixes the resume-freeze segfault AND restores blur.
# hyprlock reads this file fresh on every launch, so no reload is needed.
################################################################################

# ── Colors (hyprlang vars; hex WITHOUT '#', wrapped in rgb()/rgba()) ──────────
$base    = rgb(24273a)
$text    = rgb(cad3f5)
$subtext = rgb(a5adcb)
$accent  = rgb(b7bdf8)
$inner   = rgba(363a4f99)
$check   = rgb(8aadf4)
$fail    = rgb(ee99a0)
$caps    = rgb(f5a97f)

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Wallpaper: static path, so it points at a symlink that wallpaper-set.sh
# repoints to the current wallpaper. hyprlock applies its own blur.
background {
    monitor =
    path = $HOME/.cache/wallpaper/current
    blur_passes = 2
    blur_size = 3
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $inner
    font_color = $text
    check_color = $check
    fail_color = $fail
    capslock_color = $caps
    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">Password…</span>
    position = 0, -200
    halign = center
    valign = center
}

# Clock ($TIME = HH:MM, auto-refreshed by hyprlock)
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = FiraCode Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $subtext
    font_size = 25
    font_family = FiraCode Nerd Font
    position = 0, -250
    halign = center
    valign = center
}

# Keyboard layout ($LAYOUT auto-updates on layout switch — replaces swaylock's
# show-keyboard-layout)
label {
    monitor =
    text =  $LAYOUT
    color = $subtext
    font_size = 16
    font_family = FiraCode Nerd Font
    position = 0, -295
    halign = center
    valign = center
}
