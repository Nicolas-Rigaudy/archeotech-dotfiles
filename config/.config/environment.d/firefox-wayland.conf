# Force Mozilla/Gecko apps (Zen browser) onto the Wayland backend.
#
# Zen's ARGB glass/transparency (the sameerasw transparency mod +
# zen.widget.linux.transparency) ONLY works on the Wayland backend. This is a
# Wayland session, but DISPLAY is also set (XWayland available), so without this
# Zen can fall back to XWayland and render fully opaque (black/gray chrome, no
# wallpaper). Read by the systemd user session at login and inherited by
# compositor-launched apps (app launcher, keybinds, theme-switch auto-relaunch).
MOZ_ENABLE_WAYLAND=1
