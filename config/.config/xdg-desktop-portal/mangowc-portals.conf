[preferred]
# Portal configuration for MangoWC (wlroots-based compositor)
# This file tells xdg-desktop-portal which backend to use for different portal interfaces

# Screen sharing, screenshots, screen casting - use wlr backend
default=wlr;gtk

# GTK file picker and other GTK portals
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk

# Screen capture and remote desktop - critical for Teams screen sharing
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
