# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Background opacity is set per-theme by theme-switch.py in current-theme.conf
# (transparent glass for dark themes, opaque for light so text stays readable).
# Don't set background_opacity here — it would override the per-theme value.
# A SIGUSR1 config reload does NOT re-apply background_opacity to windows that
# are already open (kitty only uses it for new OS windows), so theme-switch.py
# also runs `kitty @ set-background-opacity --all` over each instance's socket.
# That needs dynamic_background_opacity plus socket-only remote control. The
# socket lives in $XDG_RUNTIME_DIR (0700, this user only), not the abstract
# namespace, which any local user could connect to. listen_on is read at
# startup only: kitty windows opened before this line existed have no socket.
dynamic_background_opacity yes
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

tab_bar_edge bottom
tab_bar_style powerLine
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 1

cursor_trail 1
cursor_trail_decay 0.1 0.5

font_family FiraCode Nerd Font
