# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Background opacity is set per-theme by theme-switch.py in current-theme.conf
# (transparent glass for dark themes, opaque for light so text stays readable).
# Don't set background_opacity here — it would override the per-theme value.
# dynamic_background_opacity lets a live `kitty @ set-colors`/SIGUSR1 reload
# change opacity without restarting (needed for light↔dark switches).
dynamic_background_opacity yes

tab_bar_edge bottom
tab_bar_style powerLine
tab_powerline_style slanted
tab_bar_align left
tab_bar_min_tabs 1

cursor_trail 1
cursor_trail_decay 0.1 0.5

font_family FiraCode Nerd Font
