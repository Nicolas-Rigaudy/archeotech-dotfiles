# arch-update config (arch-update.conf(5)). Tracked in archeotech-dotfiles,
# stowed to ~/.config/arch-update/. Options left out keep their defaults.
# Example with every option: /usr/share/arch-update/config/arch-update.conf.example

# AUR packages go through paru (the only AUR helper installed).
AURHelper=paru

# Keep 2 versions of each package in the pacman cache (paccache -rk2).
# One rollback step plus the current version; the default is 3.
KeepOldPackages=2

# Flatpak is not installed here.
NoFlatpak
